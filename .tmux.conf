setw -g mode-keys vi

# Pane navigation: prefix + h/j/k/l or arrow keys
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R
bind -r Up select-pane -U
bind -r Down select-pane -D
bind -r Left select-pane -L
bind -r Right select-pane -R

# Enter copy mode: prefix [  (default Ctrl-b [)
# Exit copy mode: q or Escape

# Vi copy mode: yank selection
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Scroll from normal mode (tmux gets these before zsh)
bind -n C-u if-shell -F "#{pane_in_mode}" "send-keys -M" "copy-mode -u; send-keys -M -X halfpage-up"
bind -n C-d if-shell -F "#{pane_in_mode}" "send-keys -M" "copy-mode; send-keys -M -X halfpage-down"

# Mouse scroll in copy mode
set -g mouse on
