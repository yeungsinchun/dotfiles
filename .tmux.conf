setw -g mode-keys vi

# Catppuccin Mocha
set -g window-style 'bg=#1e1e2e'
set -g window-active-style 'bg=#1e1e2e'

# Full box around each pane
set -g pane-border-lines double
set -g pane-border-style 'fg=#45475a,bg=#11111b'
set -g pane-active-border-style 'fg=#cba6f7,bg=#11111b'

set -g status-position top
set -g status-style 'bg=#181825,fg=#cdd6f4'
set -g status-left ''
set -g status-left-length 0
set -g status-left-style 'bg=#181825,fg=#cdd6f4'
set -g status-right '%H:%M %d-%B-%Y'
set -g status-right-length 40
set -g status-right-style 'bg=#181825,fg=#cdd6f4'

# Keep #W stable so agent hooks can rename the tab (disable shell/OSC overwrites)
set -g allow-rename off
setw -g automatic-rename off

# Window list on the status bar: no session name, flags, or pane title
set -g window-status-format ' #I:#W '
set -g window-status-current-format ' #I:#W '
set -g window-status-style 'fg=#6c7086'
set -g window-status-current-style 'bg=#45475a,fg=#cdd6f4,bold'
set -g window-status-separator ''

set -g message-style 'bg=#313244,fg=#cdd6f4'
set -g mode-style 'bg=#45475a,fg=#cdd6f4'

# Pane navigation: prefix + h/j/k/l or arrow keys
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind Up select-pane -U
bind Down select-pane -D
bind Left select-pane -L
bind Right select-pane -R

# Enter copy mode: prefix [  (default Ctrl-b [)
# Exit copy mode: q or Escape

# Vi copy mode: yank selection
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Let neovim/vim use C-d and C-u for half-page scroll in normal mode.
unbind -n C-d
unbind -n C-u

# Detach with prefix + d instead.
bind d detach-client

# Better key handling for terminal programs inside tmux.
set -g focus-events on
set -g extended-keys on
set -g escape-time 0
set -g default-terminal "tmux-256color"
set-environment -g -u TERM
set -as terminal-overrides ",xterm-256color:RGB"
set -as terminal-overrides ",tmux-256color:RGB"

# Mouse scroll in copy mode
set -g mouse on
